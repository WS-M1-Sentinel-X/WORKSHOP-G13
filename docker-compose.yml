services:
  # Broker MQTT pour la réception des données de l'ESP8266
  mqtt:
    image: eclipse-mosquitto:2
    container_name: sentinel-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001" # MQTT over WebSocket (optionnel)
    environment:
      MQTT_BROKER_PASSWORD_ESP8266: ${MQTT_BROKER_PASSWORD_ESP8266:?Definis MQTT_BROKER_PASSWORD_ESP8266 dans .env}
      MQTT_BROKER_PASSWORD_IA: ${MQTT_BROKER_PASSWORD_IA:?Definis MQTT_BROKER_PASSWORD_IA dans .env}
      MQTT_BROKER_PASSWORD_HOMEASSISTANT: ${MQTT_BROKER_PASSWORD_HOMEASSISTANT:?Definis MQTT_BROKER_PASSWORD_HOMEASSISTANT dans .env}
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -f /mosquitto/config/passwd ]; then
          mosquitto_passwd -b -c /mosquitto/config/passwd esp8266 "$$MQTT_BROKER_PASSWORD_ESP8266"
        else
          mosquitto_passwd -b /mosquitto/config/passwd esp8266 "$$MQTT_BROKER_PASSWORD_ESP8266"
        fi
        mosquitto_passwd -b /mosquitto/config/passwd ia "$$MQTT_BROKER_PASSWORD_IA"
        mosquitto_passwd -b /mosquitto/config/passwd homeassistant "$$MQTT_BROKER_PASSWORD_HOMEASSISTANT"
        chown mosquitto:mosquitto /mosquitto/config/passwd /mosquitto/config/acl
        chmod 0700 /mosquitto/config/passwd /mosquitto/config/acl
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    networks:
      - sentinel-net

  # VPN WireGuard pour l'accès distant au réseau Sentinel
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: sentinel-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - SERVERURL=${WIREGUARD_SERVERURL:-auto}
      - SERVERPORT=51820
      - PEERS=1
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      - sentinel-net

  # Relais et conversion des flux vidéo (RTSP, WebRTC, HLS)
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: sentinel-go2rtc
    restart: unless-stopped
    devices: 
      - "/dev/video1:/dev/video1"
    volumes:
      - ./go2rtc:/config
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    networks:
      - sentinel-net

  # Home Assistant pour le Dashboard de supervision
  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: sentinel-homeassistant
    restart: unless-stopped
    privileged: true # Souvent recommandé pour l'accès matériel / réseau local si besoin
    ports:
      - "8123:8123"
    volumes:
      - ha_config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=1000
      - PGID=1000
    depends_on:
      - mqtt
    networks:
      - sentinel-net

  # IA vision : YOLOv8n sur le flux webcam relayé par go2rtc, flux annoté MJPEG sur :8090
  # IA vision : lit la webcam USB en direct (MJPEG), YOLOv8n en OpenVINO, contrôle d'accès par visage.
  # Réglages pour le Celeron N4120 dans .env : TAILLE_YOLO (416 ou 320), IPS_MAX (analyses/s).
  ia-vision:
    build: ./ia
    image: sentinel-ia
    container_name: sentinel-ia-vision
    restart: unless-stopped
    command: ["python", "vision.py", "--sans-fenetre"]
    devices:
      - ${CAMERA_DEVICE:-/dev/video0}:/dev/video0
    group_add:
      - video # accès à la webcam pour l'utilisateur non-root du conteneur
    environment:
      - MQTT_HOTE=mqtt
      - MQTT_PORT=1883
      - MQTT_UTILISATEUR=ia
      - MQTT_MOT_DE_PASSE=${MQTT_BROKER_PASSWORD_IA:?Definis MQTT_BROKER_PASSWORD_IA dans .env}
      - SOURCE_VIDEO=/dev/video0
      - MODELE_YOLO=yolov8n_${TAILLE_YOLO:-320}_openvino_model
      - TAILLE_YOLO=${TAILLE_YOLO:-320}
      - IPS_MAX=${IPS_MAX:-5}
      - API_ALERTES=${API_ALERTES:-}
      - TZ=Europe/Paris
    volumes:
      - ia_donnees:/donnees # captures horodatées des inconnus (preuves) + bibliothèque de personnes
    ports:
      - "8090:8090"
    depends_on:
      - mqtt
    networks:
      - sentinel-net

  # IA prédictive : Isolation Forest sur les mesures capteurs reçues par MQTT
  ia-anomalies:
    build: ./ia
    image: sentinel-ia
    container_name: sentinel-ia-anomalies
    restart: unless-stopped
    command: ["python", "anomalies.py", "--apprentissage", "${IA_APPRENTISSAGE:-600}"]
    environment:
      - MQTT_HOTE=mqtt
      - MQTT_PORT=1883
      - MQTT_UTILISATEUR=ia
      - MQTT_MOT_DE_PASSE=${MQTT_BROKER_PASSWORD_IA:?Definis MQTT_BROKER_PASSWORD_IA dans .env}
      - API_ALERTES=${API_ALERTES:-}
      - TZ=Europe/Paris
    volumes:
      - ia_donnees:/donnees # modèle appris : conservé entre deux redémarrages
    depends_on:
      - mqtt
    networks:
      - sentinel-net

volumes:
  ha_config:
  ia_donnees:

networks:
  sentinel-net:
    driver: bridge
