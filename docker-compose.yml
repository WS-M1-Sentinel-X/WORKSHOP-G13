services:
  # Broker MQTT pour la réception des données de l'ESP8266
  mqtt:
    image: eclipse-mosquitto:2
    container_name: sentinel-mqtt
    restart: unless-stopped
    ports:
      - "192.168.0.100:8883:8883"
    environment:
      MQTT_BROKER_PASSWORD_ESP8266: ${MQTT_BROKER_PASSWORD_ESP8266:?Definis MQTT_BROKER_PASSWORD_ESP8266 dans .env}
      MQTT_BROKER_PASSWORD_IA: ${MQTT_BROKER_PASSWORD_IA:?Definis MQTT_BROKER_PASSWORD_IA dans .env}
      MQTT_BROKER_PASSWORD_HOMEASSISTANT: ${MQTT_BROKER_PASSWORD_HOMEASSISTANT:?Definis MQTT_BROKER_PASSWORD_HOMEASSISTANT dans .env}
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -f /mosquitto/config/passwd ]; then
          mosquitto_passwd -b -c /mosquitto/config/passwd esp8266 "$$MQTT_BROKER_PASSWORD_ESP8266"
        else
          mosquitto_passwd -b /mosquitto/config/passwd esp8266 "$$MQTT_BROKER_PASSWORD_ESP8266"
        fi
        mosquitto_passwd -b /mosquitto/config/passwd ia "$$MQTT_BROKER_PASSWORD_IA"
        mosquitto_passwd -b /mosquitto/config/passwd homeassistant "$$MQTT_BROKER_PASSWORD_HOMEASSISTANT"
        chown mosquitto:mosquitto /mosquitto/config/passwd /mosquitto/config/acl /mosquitto/config/certs/server.key /mosquitto/config/certs/server.crt /mosquitto/config/certs/ca.crt /mosquitto/log
        chmod 0700 /mosquitto/config/passwd /mosquitto/config/acl
        chmod 0600 /mosquitto/config/certs/server.key
        chmod 0644 /mosquitto/config/certs/server.crt /mosquitto/config/certs/ca.crt
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    networks:
      - sentinel-net

  # VPN WireGuard pour l'accès distant au réseau Sentinel
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: sentinel-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - SERVERURL=${WIREGUARD_SERVERURL:-auto}
      - SERVERPORT=51820
      - PEERS=1
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      - sentinel-net

  # Relais et conversion des flux vidéo (RTSP, WebRTC, HLS)
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: sentinel-go2rtc
    restart: unless-stopped
    devices:
      - /dev/v4l/by-id/usb-USB_Camera_USB_Camera_202403071520007-video-index0:/dev/video0 # Caméra USB externe, chemin hôte stable
    volumes:
      - ./go2rtc:/config
    ports:
      - "192.168.0.100:8554:8554"
    networks:
      - sentinel-net

  # Home Assistant pour le Dashboard de supervision
  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: sentinel-homeassistant
    restart: unless-stopped
    ports:
      - "192.168.0.100:8123:8123"
    volumes:
      - ha_config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=1000
      - PGID=1000
    depends_on:
      - mqtt
    networks:
      - sentinel-net

  # IA vision : YOLOv8n sur le flux webcam relayé par go2rtc, flux annoté MJPEG sur :8090
  ia-vision:
    build: ./ia
    image: sentinel-ia
    container_name: sentinel-ia-vision
    restart: unless-stopped
    command: ["python", "vision.py", "--sans-fenetre"]
    environment:
      - MQTT_HOTE=mqtt
      - MQTT_PORT=1883
      - MQTT_UTILISATEUR=ia
      - MQTT_MOT_DE_PASSE=${MQTT_BROKER_PASSWORD_IA:?Definis MQTT_BROKER_PASSWORD_IA dans .env}
      - SOURCE_VIDEO=rtsp://go2rtc:8554/${CAMERA_STREAM:-camera_usb}
      - INTERVALLE_IMAGES=${INTERVALLE_IMAGES:-5}
      - OPENCV_THREADS=${OPENCV_THREADS:-1}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-1}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-1}
      - API_ALERTES=${API_ALERTES:-http://api:8000/api/v1/alerts}
      - API_JETON=${API_JETON:-}
      - TZ=Europe/Paris
    volumes:
      - ia_donnees:/donnees # captures horodatées des intrusions (preuves)
    depends_on:
      - mqtt
      - go2rtc
    networks:
      - sentinel-net

  # IA prédictive : Isolation Forest sur les mesures capteurs reçues par MQTT
  ia-anomalies:
    image: sentinel-ia
    container_name: sentinel-ia-anomalies
    restart: unless-stopped
    command: ["python", "anomalies.py", "--apprentissage", "${IA_APPRENTISSAGE:-1200}"]
    environment:
      - MQTT_HOTE=mqtt
      - MQTT_PORT=1883
      - MQTT_UTILISATEUR=ia
      - MQTT_MOT_DE_PASSE=${MQTT_BROKER_PASSWORD_IA:?Definis MQTT_BROKER_PASSWORD_IA dans .env}
      - API_ALERTES=${API_ALERTES:-http://api:8000/api/v1/alerts}
      - API_JETON=${API_JETON:-}
      - TZ=Europe/Paris
    volumes:
      - ia_donnees:/donnees # modèle appris : conservé entre deux redémarrages
    depends_on:
      - mqtt
      - ia-vision # construit l'image sentinel-ia partagée
    networks:
      - sentinel-net

  # API des alertes (POST /api/v1/alerts) + historique SQLite. Interne au réseau Docker : non exposée sur le Wi-Fi.
  api:
    build: ./api
    image: sentinel-api
    container_name: sentinel-api
    restart: unless-stopped
    environment:
      - API_JETON=${API_JETON:-}
      - TZ=Europe/Paris
    volumes:
      - api_donnees:/donnees # base SQLite des alertes
    networks:
      - sentinel-net

volumes:
  ha_config:
  ia_donnees:
  api_donnees:

networks:
  sentinel-net:
    driver: bridge