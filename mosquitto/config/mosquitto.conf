# Broker MQTT dedie a Sentinel-X (independant de Home Assistant).
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# MQTT over WebSocket pour un eventuel client web.
listener 9001 0.0.0.0
protocol websockets
