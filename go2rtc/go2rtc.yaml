api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"

streams:
  camera_usb:
    - exec:ffmpeg -hide_banner -loglevel error -f v4l2 -input_format mjpeg -video_size 640x360 -framerate 5 -i /dev/video0 -an -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -profile:v baseline -g 5 -keyint_min 5 -bf 0 -threads 1 -flush_packets 1 -rtsp_transport tcp -f rtsp {output}
